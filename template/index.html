<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <base href="/" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="My Quarkdown blog" />
        <link rel="stylesheet" type="text/css" media="all" href="themes/default.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
        <title>My Blog</title>
        <!-- RSS Feed -->
        <link rel="alternate" type="application/rss+xml" title="Blog RSS" href="/en/feed.xml" />
        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="My Blog" />
        <meta property="og:description" content="My Quarkdown blog" />
        <meta property="og:image" content="" />
        <meta property="og:url" content="" />
        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="My Blog" />
        <meta name="twitter:description" content="My Quarkdown blog" />
        <meta name="twitter:image" content="" />
    </head>
    <body>
        <div class="cursor-dot" id="cursorDot"></div>
        <div id="content"></div>

        <!-- Dependencies (CDN) -->
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlightjs-line-numbers.js/2.8.0/highlightjs-line-numbers.min.js"></script>

        <!-- Quarkdown -->
        <script type="module">
            import { Quarkdown } from './src/quarkdown.js';

            const app = new Quarkdown({
                siteName: 'My Blog',
                baseUrl: 'https://example.github.io',
                languages: ['en'],
                defaultLanguage: 'en',
                postsDir: 'posts',
                homeFile: 'home-{lang}.md',
                postsPerPage: 10,
                cursorDot: true,
                starfield404: true,
                feedFileName: 'feed.xml',
                translations: {
                    en: {
                        nav: { home: 'Home', blog: 'Blog' },
                        blog: { title: 'Blog', noPosts: 'No posts yet.', readMore: 'Read more' },
                        pagination: { previous: 'Previous', next: 'Next' },
                        date: { locale: 'en-US' },
                    },
                },
            });

            app.start();
        </script>
    </body>
</html>
